# cargo-deny: лицензии зависимостей, известные уязвимости, источники крейтов.
# Запуск: cargo deny check

[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
# Только лицензии, совместимые с open source и коммерческим использованием.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# DLL-плагины не поддерживаются (см. docs/PLUGINS.md).
deny = [{ crate = "libloading" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
