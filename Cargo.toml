[workspace]
resolver = "3"
members = ["crates/plugin-api", "crates/core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/noNhead/voice-to-text"

[workspace.dependencies]
vtt-plugin-api = { path = "crates/plugin-api" }
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Документировать каждую ошибку в публичных функциях пока избыточно: типы ошибок говорят сами за себя.
missing_errors_doc = "allow"
# Сэмплы → секунды: потеря точности f64 на таких величинах невозможна.
cast_precision_loss = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
